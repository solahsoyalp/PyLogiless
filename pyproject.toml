[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["pylogiless/tests"]
python_files = "test_*.py"
addopts = "-q"

[tool.coverage.run]
source = ["pylogiless"]

[tool.coverage.report]
show_missing = true
