[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogiless"
dynamic = ["version"]
description = "Python client for the LOGILESS API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "LOGILESS API Python Client Contributors", email = "contact@logiless.jp" },
]
keywords = ["logiless", "api", "logistics", "inventory", "warehouse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "coverage>=7",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "coverage>=7",
]

[project.urls]
Homepage = "https://github.com/logiless/pylogiless"
"Bug Reports" = "https://github.com/logiless/pylogiless/issues"
Source = "https://github.com/logiless/pylogiless"

[tool.setuptools.dynamic]
version = { attr = "pylogiless.__version__" }

[tool.setuptools.packages.find]
where = ["pylogiless"]
include = ["pylogiless", "pylogiless.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"pylogiless" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["pylogiless/tests"]
python_files = "test_*.py"
addopts = "-q"

[tool.coverage.run]
source = ["pylogiless"]

[tool.coverage.report]
show_missing = true
